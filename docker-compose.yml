services:
  # Write database: the event store (events, unique_keys), the outbox and
  # auth's tables. src/sql/event_store.sql runs on a new volume.
  pointage_db:
    image: ghcr.io/baosystems/postgis:16-3.5
    container_name: pointage_db
    environment:
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB:       pointage_db
    ports:
      - '7433:5432'
    volumes:
      - pointage_db_data:/var/lib/postgresql/data
      - ./src/sql/event_store.sql:/docker-entrypoint-initdb.d/10_event_store.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  # Read database: the read models, fed by the projection runner.
  # src/sql/read_model.sql runs on a new volume.
  pointage_read_db:
    image: ghcr.io/baosystems/postgis:16-3.5
    container_name: pointage_read_db
    environment:
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB:       pointage_read_db
    ports:
      - '7434:5432'
    volumes:
      - pointage_read_db_data:/var/lib/postgresql/data
      - ./src/sql/read_model.sql:/docker-entrypoint-initdb.d/10_read_model.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pointage_redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    container_name: pointage_minio
    ports:
      - '9010:9010'
      - '9011:9011'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --address ":9010" --console-address ":9011"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9010/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: pointage_mailpit
    ports:
      - '1045:1045'
      - '8045:8045'
    environment:
      # Mailpit listens on 1025 / 8025 by default: bind it to the published ports.
      MP_SMTP_BIND_ADDR:           '0.0.0.0:1045'
      MP_UI_BIND_ADDR:             '0.0.0.0:8045'
      MP_SMTP_AUTH_ACCEPT_ANY:     'true'
      MP_SMTP_AUTH_ALLOW_INSECURE: 'true'
      MP_MAX_MESSAGES:             '500'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://localhost:8045/readyz']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
    pointage_db_data:
    pointage_read_db_data: